name: Mutation Dashboard

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "llms.txt"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_LATEST_LTS: "26"

jobs:
  mutation:
    runs-on: ubuntu-latest
    # Skips release commits (release.yml pushes those with the same App token, so they'd
    # otherwise retrigger this workflow too) and skips this workflow's own baseline-refresh
    # commit below — the App token push does trigger `on: push` (unlike the default
    # GITHUB_TOKEN), so without this guard every successful baseline commit would trigger
    # another full mutation run, indefinitely.
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !contains(github.event.head_commit.message, 'refresh mutation testing incremental baseline')
    # A full run currently takes ~22-30+ min and grows with the helper count; 45 min gives
    # headroom for that growth. Sharding the mutation run (e.g. a matrix per helper category)
    # is the durable fix once this margin gets tight again — see helpers4/typescript#159.
    timeout-minutes: 45

    steps:
      # main is a protected branch that rejects direct pushes from the default GITHUB_TOKEN
      # (requires verified signatures / a PR) — a GitHub App installation token is one of the
      # bypass actors, same as release.yml's version-bump commits use.
      - name: Get GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_LATEST_LTS }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mutation tests with dashboard report
        env:
          CI: "true"
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
          STRYKER_DASHBOARD_VERSION: main
        run: pnpm mutation

      # This is the only place reports/mutation/incremental.json ever gets refreshed — without
      # it, Stryker's incremental mode has no fresh baseline to diff against and every run
      # (here and on every PR) degrades toward a full, timeout-minutes-length project-wide
      # mutation test.
      # `always()` so a below-threshold score (pnpm mutation exits non-zero on that, per
      # stryker.config.mjs's `break: 60`) still gets its baseline committed — a fresh baseline
      # is valuable regardless of whether this run's score itself passed.
      - name: Commit the refreshed incremental baseline
        if: always()
        run: |
          if git diff --quiet -- reports/mutation/incremental.json; then
            echo "Incremental baseline unchanged — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mutation/incremental.json
          git commit -m "chore(CI-CD): 🔧 refresh mutation testing incremental baseline"

          if ! git push origin HEAD:main; then
            echo "::warning::Push failed (likely raced another push to main) — the baseline stays stale until the next push-to-main run retries this."
          fi
